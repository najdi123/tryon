# nginx site for Ayeneh-rang (zibarokh.rukhat.com). The app listens on 127.0.0.1:3008.
# The limits are per visitor address. A gallery's customers often share one address (the shop's
# Wi-Fi), so the limits are set for a busy shop, not for one phone.

limit_req_zone $binary_remote_addr zone=ar_events:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ar_tryon:10m  rate=30r/m;
# Only sign-in attempts (POST) are limited; opening the login page is not.
map $request_method $ar_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $ar_login_key zone=ar_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name zibarokh.rukhat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zibarokh.rukhat.com;

    ssl_certificate     /etc/letsencrypt/live/zibarokh.rukhat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zibarokh.rukhat.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    # The visitor's real address only: whatever the browser claims in this header is dropped,
    # because the staff login's lock is keyed on it.
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3008;
    }
    location = /api/events {
        limit_req zone=ar_events burst=60 nodelay;
        proxy_pass http://127.0.0.1:3008;
    }
    # The app sends a 1280 px JPEG (under 2 MB) and answers within 50 s.
    location = /api/tryon {
        limit_req zone=ar_tryon burst=20 nodelay;
        client_max_body_size 3m;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3008;
    }
    # Development only: the before and after pictures of a try-on (RECORD_TRYONS=1).
    location = /api/tryon/record {
        limit_req zone=ar_events burst=60 nodelay;
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:3008;
    }
    location = /admin/login {
        limit_req zone=ar_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3008;
    }
    # Staff forms (server actions) are small; the catalogue page posts one row at a time.
    location /admin {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3008;
    }
}
